<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
		<title>天孚580 公务机 3D 展示</title>
		<style>
			:root {
				--g1: #bcd9f7;
				--g2: #f3f7fb;
				--fg: #0f2038;
				--pn: rgba(255, 255, 255, .78);
				--bd: rgba(15, 32, 56, .18);
				--ac: #1c5fd6;
				--acf: #fff;
				box-sizing: border-box;
				padding-top: env(safe-area-inset-top, 0px);
				padding-bottom: env(safe-area-inset-bottom, 0px)
			}

			:root[data-theme="dark"] {
				--g1: #04060d;
				--g2: #18233f;
				--fg: #e6ecf8;
				--pn: rgba(14, 20, 36, .78);
				--bd: rgba(200, 215, 255, .2);
				--ac: #7aa7ff;
				--acf: #06122b
			}

			@media (prefers-color-scheme:dark) {
				:root:not([data-theme="light"]) {
					--g1: #04060d;
					--g2: #18233f;
					--fg: #e6ecf8;
					--pn: rgba(14, 20, 36, .78);
					--bd: rgba(200, 215, 255, .2);
					--ac: #7aa7ff;
					--acf: #06122b
				}
			}

			html,
			body {
				height: 100%;
				margin: 0;
				overflow: hidden
			}

			body {
				background: linear-gradient(180deg, var(--g1), var(--g2) 72%);
				color: var(--fg);
				font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
				transition: background .6s
			}

			canvas {
				position: fixed;
				inset: 0;
				width: 100%;
				height: 100%;
				display: block;
				touch-action: none
			}

			#top {
				position: fixed;
				left: 16px;
				top: calc(12px + env(safe-area-inset-top, 0px));
				pointer-events: none
			}

			#top b {
				font-size: 22px;
				letter-spacing: .04em;
				display: block
			}

			#top span {
				font-size: 13px;
				opacity: .7
			}

			#ui {
				position: fixed;
				left: 10px;
				right: 10px;
				bottom: calc(10px + env(safe-area-inset-bottom, 0px));
				max-width: 760px;
				margin: 0 auto;
				background: var(--pn);
				border: 1px solid var(--bd);
				border-radius: 14px;
				padding: 8px 10px;
				backdrop-filter: blur(12px);
				-webkit-backdrop-filter: blur(12px)
			}

			.g {
				display: flex;
				flex-wrap: wrap;
				gap: 6px;
				align-items: center;
				padding: 4px 0
			}

			.g+.g {
				border-top: 1px solid var(--bd)
			}

			.g label {
				font-size: 12px;
				opacity: .65;
				width: 36px
			}

			button {
				font: inherit;
				font-size: 13px;
				color: var(--fg);
				background: transparent;
				border: 1px solid var(--bd);
				border-radius: 8px;
				padding: 5px 10px;
				cursor: pointer
			}

			button:focus-visible {
				outline: 2px solid var(--ac);
				outline-offset: 2px
			}

			button.on {
				background: var(--ac);
				color: var(--acf);
				border-color: var(--ac)
			}

			#st {
				font-size: 12px;
				opacity: .8;
				margin-left: 4px
			}

			.g[hidden] {
				display: none
			}

			#mrow button {
				touch-action: none;
				user-select: none;
				-webkit-user-select: none;
				-webkit-touch-callout: none
			}

			#mrow button.hold {
				background: var(--ac);
				color: var(--acf);
				border-color: var(--ac)
			}

			#mkeys {
				font-size: 11px;
				opacity: .6;
				flex-basis: 100%
			}

			#hud {
				position: fixed;
				left: 16px;
				top: calc(62px + env(safe-area-inset-top, 0px));
				min-width: 150px;
				padding: 8px 12px;
				background: var(--pn);
				border: 1px solid var(--bd);
				border-radius: 12px;
				backdrop-filter: blur(12px);
				-webkit-backdrop-filter: blur(12px);
				font-size: 12px;
				pointer-events: none;
				font-variant-numeric: tabular-nums
			}

			#hud[hidden] {
				display: none
			}

			#hud div {
				display: flex;
				justify-content: space-between;
				gap: 14px;
				line-height: 1.7
			}

			#hud i {
				font-style: normal;
				opacity: .65
			}

			#hud .bar {
				height: 5px;
				border-radius: 3px;
				background: var(--bd);
				margin: 2px 0 4px;
				overflow: hidden
			}

			#hud .bar b {
				display: block;
				height: 100%;
				width: 0;
				background: var(--ac)
			}

			#hud #hm {
				display: block;
				margin-top: 4px;
				color: var(--ac);
				font-size: 13px;
				min-height: 1.3em
			}

			#tip {
				position: fixed;
				right: 16px;
				top: calc(14px + env(safe-area-inset-top, 0px));
				font-size: 12px;
				opacity: .6;
				text-align: right;
				pointer-events: none
			}
		</style>
	</head>
	<body>
		<div id="top"><b>天孚TF-580 </b><span>小型公务飞机 · 3D 展示</span></div>
		<div id="hud" hidden>
			<div><i>速度</i><span id="hs">0</span></div>
			<div><i>高度</i><span id="ha">0</span></div>
			<div><i>升降率</i><span id="hv">0</span></div>
			<div><i>俯仰</i><span id="hp">0</span></div>
			<div><i>油门</i><span id="ht">0%</span></div>
			<div class="bar"><b id="hb"></b></div><span id="hm"></span>
		</div>
		<div id="tip">拖拽旋转　滚轮或双指缩放<br>右键平移</div>
		<div id="ui">
			<div class="g"><label>视角</label><button data-v="out" class="on">外观</button><button
					data-v="cock">驾驶舱</button><button data-v="cab">客舱前部</button><button data-v="aft">客舱后部</button></div>
			<div class="g"><label>灯光</label><button data-l="nav" class="on">航行灯</button><button data-l="strobe"
					class="on">防撞闪光灯</button><button data-l="beacon" class="on">信标灯</button><button
					data-l="land">着陆灯</button><button data-l="cabin" class="on">舱内灯</button><button
					id="all">全部关闭</button></div>
			<div class="g"><label>飞行</label><button id="fto">起飞</button><button id="fld">降落</button><button
					id="frs">复位</button><button id="fman">手动驾驶</button><span id="st"></span></div>
			<div class="g" id="mrow" hidden><label>操控</label><button data-h="thD">油门−</button><button
					data-h="thU">油门＋</button><button data-h="ptU">抬头</button><button data-h="ptD">低头</button><button
					data-c="lvl">改平</button><button data-h="brk">刹车</button><button data-c="gear">起落架</button><span
					id="mkeys">键盘：W/S 油门　↑/↓ 抬头/低头　空格 刹车　G 起落架　L 着陆灯　R 改平</span></div>
			<div class="g"><label>场景</label><button id="ar" class="on">自动旋转</button></div>
		</div>
		<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
		<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
		<script>
			const $ = s => document.querySelector(s),
				PI = Math.PI;
			const R = new THREE.WebGLRenderer({
				antialias: true,
				alpha: true
			});
			R.setPixelRatio(Math.min(devicePixelRatio, 2));
			R.shadowMap.enabled = true;
			R.shadowMap.type = THREE.PCFSoftShadowMap;
			R.toneMapping = THREE.ACESFilmicToneMapping;
			R.outputEncoding = THREE.sRGBEncoding;
			document.body.prepend(R.domElement);
			const S = new THREE.Scene(),
				C = new THREE.PerspectiveCamera(38, 1, .05, 300);
			const OC = new THREE.OrbitControls(C, R.domElement);
			OC.enableDamping = true;
			OC.dampingFactor = .07;
			OC.autoRotate = true;
			OC.autoRotateSpeed = .7;
			OC.minDistance = 7;
			OC.maxDistance = 45;
			OC.maxPolarAngle = PI * .52;
			C.position.set(15, 5.5, 14);
			OC.target.set(0, .1, 0);
			const mats = [];

			function M(c, r = .4, m = 0) {
				const x = new THREE.MeshStandardMaterial({
					color: c,
					roughness: r,
					metalness: m
				});
				mats.push(x);
				return x
			}
			const hemi = new THREE.HemisphereLight(0xffffff, 0x9aa6b3, .7),
				sun = new THREE.DirectionalLight(0xfff3e0, 2.4);
			sun.position.set(12, 18, 10);
			sun.castShadow = true;
			sun.shadow.mapSize.set(2048, 2048);
			Object.assign(sun.shadow.camera, {
				left: -14,
				right: 14,
				top: 14,
				bottom: -14,
				near: 1,
				far: 60
			});
			sun.shadow.bias = -.0005;
			S.add(hemi, sun);
			/* 环境反射 */
			const pm = new THREE.PMREMGenerator(R);
			let envRT;

			function makeEnv(d) {
				const e = new THREE.Scene(),
					c = document.createElement('canvas');
				c.width = 4;
				c.height = 256;
				const g = c.getContext('2d'),
					gr = g.createLinearGradient(0, 0, 0, 256),
					st = d ? ['#05070f', '#101a33', '#0a0d16'] : ['#7fb2ee', '#e6f0fa', '#8c98a4'];
				gr.addColorStop(0, st[0]);
				gr.addColorStop(.5, st[1]);
				gr.addColorStop(1, st[2]);
				g.fillStyle = gr;
				g.fillRect(0, 0, 4, 256);
				const tx = new THREE.CanvasTexture(c);
				tx.encoding = THREE.sRGBEncoding;
				e.add(new THREE.Mesh(new THREE.SphereGeometry(50, 32, 16), new THREE.MeshBasicMaterial({
					map: tx,
					side: THREE.BackSide
				})));
				const k = d ? .8 : 7;
				[
					[0, 30, 0, 30, 1, 30],
					[40, 10, 10, 1, 15, 30],
					[-40, 12, -10, 1, 15, 30]
				].forEach(a => {
					const b = new THREE.Mesh(new THREE.BoxGeometry(a[3], a[4], a[5]), new THREE.MeshBasicMaterial({
						color: new THREE.Color(k, k, k * (d ? 1.4 : 1))
					}));
					b.position.set(a[0], a[1], a[2]);
					e.add(b)
				});
				if (envRT) envRT.dispose();
				envRT = pm.fromScene(e, .02);
				S.environment = envRT.texture
			}
			/* 地面 */
			function groundTex(col) {
				const c = document.createElement('canvas');
				c.width = c.height = 512;
				const g = c.getContext('2d'),
					r = g.createRadialGradient(256, 256, 0, 256, 256, 256);
				r.addColorStop(0, col);
				r.addColorStop(.55, col);
				r.addColorStop(1, 'rgba(0,0,0,0)');
				g.fillStyle = r;
				g.fillRect(0, 0, 512, 512);
				const t = new THREE.CanvasTexture(c);
				t.encoding = THREE.sRGBEncoding;
				return t
			}
			const gm = new THREE.Mesh(new THREE.CircleGeometry(70, 64), new THREE.MeshStandardMaterial({
				transparent: true,
				roughness: .85
			}));
			gm.rotation.x = -PI / 2;
			gm.position.y = -2.4;
			gm.receiveShadow = true;
			S.add(gm);
			const line = new THREE.Mesh(new THREE.PlaneGeometry(50, .14), new THREE.MeshStandardMaterial({
				color: 0xe8c547,
				roughness: .8
			}));
			line.rotation.x = -PI / 2;
			line.position.y = -2.39;
			line.receiveShadow = true;
			line.visible = false;
			/* 光晕与灯 */
			const glow = (() => {
				const c = document.createElement('canvas');
				c.width = c.height = 64;
				const g = c.getContext('2d'),
					r = g.createRadialGradient(32, 32, 0, 32, 32, 32);
				r.addColorStop(0, 'rgba(255,255,255,1)');
				r.addColorStop(.25, 'rgba(255,255,255,.45)');
				r.addColorStop(1, 'rgba(255,255,255,0)');
				g.fillStyle = r;
				g.fillRect(0, 0, 64, 64);
				return new THREE.CanvasTexture(c)
			})();
			const LT = {
				nav: [],
				strobe: [],
				beacon: [],
				land: []
			};

			function bulb(g, k, col, pos, size, pi, range) {
				const m = new THREE.Mesh(new THREE.SphereGeometry(size * .16, 12, 8), new THREE.MeshBasicMaterial({
					color: 0x333333
				}));
				const sp = new THREE.Sprite(new THREE.SpriteMaterial({
					map: glow,
					color: col,
					blending: THREE.AdditiveBlending,
					depthWrite: false,
					transparent: true,
					opacity: 0
				}));
				sp.scale.setScalar(size);
				const o = {
					m,
					sp,
					col: new THREE.Color(col),
					pi
				};
				const a = [m, sp];
				if (pi > 0) {
					o.pl = new THREE.PointLight(col, 0, range, 1);
					a.push(o.pl)
				}
				a.forEach(x => x.position.set(...pos));
				g.add(...a);
				LT[k].push(o);
				return o
			}

			function setL(o, v) {
				o.sp.material.opacity = v;
				o.sp.visible = v > .01;
				o.m.material.color.set(0x333333).lerp(o.col, v);
				if (o.pl) o.pl.intensity = o.pi * v;
				if (o.spot) {
					o.spot.intensity = 6 * v;
					o.beam.material.opacity = .13 * v;
					o.beam.visible = v > .01
				}
			}
			/* 机身 */
			const plane = new THREE.Group();
			S.add(plane);

			function rad(y) {
				if (y > 5.2) {
					const t = Math.min(1, (8 - y) / 2.8);
					return 1.15 * Math.pow(Math.sin(t * PI / 2), .62)
				}
				if (y > -2.5) return 1.15;
				const t = (y + 8) / 5.5;
				return .22 + .93 * Math.pow(t, .8)
			}
			const prof = [new THREE.Vector2(0, -8)];
			for (let i = 0; i <= 120; i++) {
				const y = -8 + 16 * i / 120;
				prof.push(new THREE.Vector2(rad(y), y))
			}
			const sc = document.createElement('canvas');
			sc.width = sc.height = 512; {
				const g = sc.getContext('2d');
				g.fillStyle = '#f6f8fa';
				g.fillRect(0, 0, 512, 512);
				g.fillStyle = '#c5ccd5';
				g.fillRect(.1 * 512, 0, .3 * 512, 512);
				[
					[.015, .03, '#14305c'],
					[.455, .03, '#14305c'],
					[.05, .008, '#c9a24a'],
					[.442, .008, '#c9a24a']
				].forEach(s => {
					g.fillStyle = s[2];
					g.fillRect(s[0] * 512, 0, s[1] * 512, 512)
				})
			}
			const st = new THREE.CanvasTexture(sc);
			st.encoding = THREE.sRGBEncoding;
			const mF = new THREE.MeshPhysicalMaterial({
				map: st,
				roughness: .3,
				metalness: .2,
				clearcoat: .8,
				clearcoatRoughness: .15,
				side: THREE.DoubleSide
			});
			mats.push(mF);
			const fus = new THREE.Mesh(new THREE.LatheGeometry(prof, 64), mF);
			fus.rotation.z = -PI / 2;
			fus.castShadow = true;
			plane.add(fus);
			const mL = M(0xe9e1d3, .85);
			mL.side = THREE.DoubleSide;
			const liner = new THREE.Mesh(new THREE.LatheGeometry(prof.map(p => new THREE.Vector2(p.x * .95, p.y)), 48), mL);
			liner.rotation.z = -PI / 2;
			plane.add(liner);
			const glass = M(0x0a121c, .05, .9),
				winIn = [];

			function win(x, y, sx, sy) {
				const ro = Math.sqrt(1.15 * 1.15 - y * y),
					ri = Math.sqrt(1.0925 * 1.0925 - y * y) - .012;
				[1, -1].forEach(s => {
					const w = new THREE.Mesh(new THREE.SphereGeometry(1, 16, 12), glass);
					w.scale.set(sx, sy, .05);
					w.position.set(x, y, s * ro);
					plane.add(w);
					const p = new THREE.Mesh(new THREE.CircleGeometry(1, 20), new THREE.MeshBasicMaterial({
						color: 0xbfe3ff,
						side: THREE.DoubleSide
					}));
					p.scale.set(sx, sy, 1);
					p.position.set(x, y, s * ri);
					p.lookAt(x, y, 0);
					plane.add(p);
					winIn.push(p)
				})
			}
			for (let i = 0; i < 8; i++) win(-2.6 + .9 * i, .25, .27, .19);
			win(4.55, .4, .32, .2);
			win(5.0, .4, .3, .2);
			const wsh = new THREE.Mesh(new THREE.SphereGeometry(1, 24, 16), glass);
			wsh.scale.set(.75, .42, .62);
			wsh.position.set(5.7, .78, 0);
			wsh.rotation.z = -.25;
			plane.add(wsh);
			/* 机翼 机尾 发动机 起落架（对称） */
			const Mw = M(0xeef1f5, .35, .2),
				Mn = M(0x14305c, .3, .3),
				Mk = M(0x20242b, .8),
				Mm = M(0x2a2e35, .4, .9);
			const MG = [],
				NG = new THREE.Group();
			NG.position.set(4.3, -1.15, 0);
			plane.add(NG);
			const shp = a => {
				const s = new THREE.Shape();
				a.forEach((p, i) => i ? s.lineTo(p[0], p[1]) : s.moveTo(p[0], p[1]));
				return s
			};
			const ext = (s, d) => new THREE.ExtrudeGeometry(s, {
				depth: d,
				bevelEnabled: true,
				bevelThickness: .03,
				bevelSize: .03,
				bevelSegments: 2
			});
			const mesh = (g, m, p) => {
				const o = new THREE.Mesh(g, m);
				o.position.set(...p);
				o.castShadow = true;
				return o
			};
			[1, -1].forEach(s => {
				const g = new THREE.Group();
				g.scale.z = s;
				plane.add(g);
				const w = mesh(ext(shp([
					[1.2, .3],
					[-1.7, 6],
					[-2.9, 6],
					[-1.4, .3]
				]), .1), Mw, [0, -.5, 0]);
				w.rotation.x = PI / 2 - .06;
				g.add(w);
				const wl = mesh(ext(shp([
					[0, 0],
					[.55, 0],
					[-.15, .95],
					[-.45, .95]
				]), .05), Mn, [-2.35, -.14, 5.95]);
				wl.rotation.x = .15;
				g.add(wl);
				const sb = mesh(ext(shp([
					[-6.5, 0],
					[-7.6, 2.2],
					[-8.1, 2.2],
					[-7.7, 0]
				]), .1), Mw, [0, 2.95, 0]);
				sb.rotation.x = PI / 2;
				g.add(sb);
				g.add(mesh(new THREE.CylinderGeometry(.27, .34, 2.2, 28).rotateZ(PI / 2), Mw, [-5, .35, 1.25]));
				g.add(mesh(new THREE.CylinderGeometry(.2, .26, .3, 24).rotateZ(PI / 2), Mm, [-6.2, .35, 1.25]));
				const ci = new THREE.Mesh(new THREE.CircleGeometry(.27, 20).rotateY(PI / 2), Mk);
				ci.position.set(-3.89, .35, 1.25);
				g.add(ci);
				g.add(mesh(new THREE.BoxGeometry(1.4, .1, .45), Mw, [-5, .35, .95]));
				const mg = new THREE.Group();
				mg.position.set(-.7, -.4, 1.0);
				g.add(mg);
				MG.push(mg);
				mg.add(mesh(new THREE.CylinderGeometry(.05, .05, 1.5, 10), Mm, [0, -.95, 0]));
				mg.add(mesh(new THREE.CylinderGeometry(.3, .3, .2, 24).rotateX(PI / 2), Mk, [0, -1.7, 0]));
				mg.add(mesh(new THREE.CylinderGeometry(.14, .14, .22, 16).rotateX(PI / 2), Mm, [0, -1.7, 0]));
				NG.add(mesh(new THREE.CylinderGeometry(.3, .3, .14, 24).rotateX(PI / 2), Mk, [0, -.95, s * .12]));
				bulb(g, 'nav', s > 0 ? 0x22ff66 : 0xff2222, [-2.55, .8, 6.05], .9, 1.6, 7);
				bulb(g, 'strobe', 0xffffff, [-2.85, -.12, 5.95], 1.5, 0, 0);
				const sp = new THREE.SpotLight(0xfff1d0, 0, 70, .38, .55, 1);
				sp.position.set(.3, -.5, 2.2);
				const tg = new THREE.Object3D();
				tg.position.set(30, -2.4, 2.6);
				g.add(sp, tg);
				sp.target = tg;
				const beam = new THREE.Mesh(new THREE.CylinderGeometry(.03, 2.2, 24, 24, 1, true).translate(0, -12, 0),
					new THREE.MeshBasicMaterial({

					F.pitch = ap(F.pitch, 0, 2);

					MN.th = 0;
					MN.vr = 0;

					hud();
					return
				}
				const ti = K.thU - K.thD,
					pi = K.ptU - K.ptD;
				MN.th = Math.max(0, Math.min(1, MN.th + ti * .3 * dt));
				if (pi) MN.lv = 0;
				if (MN.lv) MN.pt = ap(MN.pt, 0, 3);
				else MN.pt = Math.max(-.16, Math.min(.28, MN.pt + pi * .22 * dt));
				if (MN.msgT > 0 && (MN.msgT -= dt) <= 0) MN.msg = '';
				/* 速度 */
				F.spd += (MN.th - F.spd) * (MN.th > F.spd ? .12 : .1) * dt;
				if (gnd) {
					F.spd -= (.04 + (K.brk ? .4 : 0)) * dt
				}
				F.spd = Math.max(0, Math.min(1, F.spd));
				/* 升力 */
				const L = Math.max(0, Math.min(1, (F.spd - .35) / .25));
				const eff = gnd ? (F.spd > .3 ? Math.max(0, MN.pt) : 0) : MN.pt;
				F.pitch = ap(F.pitch, eff, 2);
				let vr = L * F.pitch * .8 - (1 - L) * (gnd ? 0 : .09);
				if (gnd && vr < 0) vr = 0;
				const raw = F.alt + vr * dt;
				if (raw <= 0 && F.alt > 0) {
					if (F.gear < .85) {
						MN.crash = 1;
						note('起落架未放下！', 99)
					} else if (vr < -.07) note('重着陆！', 3);
					else note('平稳着陆', 3);
					F.alt = 0;
					vr = 0
				} else F.alt = Math.max(0, Math.min(1, raw));
				if (gnd && F.alt > 0) note('离地', 2);
				MN.vr = vr;
				/* 状态 */
				let st;
				if (F.alt <= 0) st = F.spd < .02 ? '地面停机' : F.spd < .3 ? '地面滑行' : '高速滑跑';
				else if (L < 1 && vr < -.02) st = '失速警告';
				else if (F.alt < .12 && vr < -.01 && F.gear > .9) st = '进近';
				else st = vr > .03 ? '爬升' : vr < -.02 ? '下降' : '平飞';
				F.stage = st;
				hud()
			}

			let lastTxt = '';

			function fup(dt, t) {
				const ap = (c, g, r) => c + (g - c) * (1 - Math.exp(-r * dt)),

				DG.children.forEach(d => {

				});

					d.x -= 70 * F.spd * d.v * dt;
					if (d.x < -40) d.x += 80;
					const L = d.l * (.3 + F.spd * 3.5);
					spA[i * 6] = d.x;
					spA[i * 6 + 1] = d.y;
					spA[i * 6 + 2] = d.z;
					spA[i * 6 + 3] = d.x + L;
					spA[i * 6 + 4] = d.y;
					spA[i * 6 + 5] = d.z
				}
				sg.attributes.position.needsUpdate = true;
				sm.material.opacity = Math.min(1, F.spd * 1.4) * .9;
				VT.forEach(v => {
					const a = v.l.geometry.attributes.position;
					for (let j = 0; j < 70; j++) {
						const u = j / 69,
							an = u * 30 - t * 12,
							r = .1 + u * .5;
						a.setXYZ(j, -2.9 - u * 22, -.3 + Math.sin(an) * r, v.s * (6 - u * .3) + Math.cos(an) * r)
					}
					a.needsUpdate = true;
					v.l.material.opacity = .7 * Math.min(1, F.alt * 3) * Math.min(1, F.spd * 1.5)
				});
				CL.forEach(c => {
					c.position.x -= 45 * F.spd * dt;
					if (c.position.x < -80) c.position.x += 160;
					c.material.opacity = .16 * Math.min(1, F.alt * 2)
				});
				const gt = g > .98 ? '放下' : g < .02 ? '收起' : (F.tG ? '放下中' : '收起中'),
					tx = F.stage + ' · 起落架' + gt;
				if (tx !== lastTxt) {
					lastTxt = tx;
					$('#st').textContent = tx
				}
			}
			/* 循环 */
			function size() {
				R.setSize(innerWidth, innerHeight);
				C.aspect = innerWidth / innerHeight;
				C.updateProjectionMatrix()
			}
			addEventListener('resize', size);
			size();
			const clk = new THREE.Clock();

			function tick() {
				const dt = Math.min(clk.getDelta(), .05),
					t = clk.elapsedTime;
				if (anim > 0) {
					anim = Math.max(0, anim - dt / 1.3);
					const k = 1 - anim,
						e = k * k * (3 - 2 * k);
					C.position.lerpVectors(sP, eP, e);
					OC.target.lerpVectors(sT, eT, e);
					if (anim === 0) {
						OC.enabled = true;
						OC.enablePan = !inside;
						OC.enableZoom = !inside;
						OC.rotateSpeed = inside ? -.45 : 1;
						OC.minDistance = inside ? .02 : 7;
						OC.maxDistance = inside ? .02 : 45;
						OC.maxPolarAngle = inside ? PI : PI * .52
					}
				}
				LT.nav.forEach(o => setL(o, on.nav ? 1 : 0));
				const ph = t % 1.2,
					fl = on.strobe && (ph < .07 || (ph > .2 && ph < .27)) ? 1 : 0;
				LT.strobe.forEach(o => setL(o, fl));
				const bv = on.beacon ? Math.pow(Math.max(0, Math.sin(t * 5.5)), 2) : 0;
				LT.beacon.forEach(o => setL(o, bv));
				LT.land.forEach(o => setL(o, on.land ? 1 : 0));
				cabPL.forEach(p => p.intensity = on.cabin ? 1.15 : 0);
				stripM.color.set(0x222018).lerp(new THREE.Color(0xfff3d6), on.cabin ? 1 : 0);
				fup(dt, t);
				OC.update();
				R.render(S, C);
				requestAnimationFrame(tick)
			}
			tick();
		</script>
	</body>
</html>
